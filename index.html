<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Socius Academy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">

      <h1 class="logo">Socius Academy</h1>
      <p class="subtitle">Plataforma de treinamento</p>

      <form id="loginForm">
        <div class="field">
          <label for="email">Usuário ou e-mail</label>
          <input type="text" id="email" placeholder="socius ou email@empresa.com" required>
        </div>

        <div class="field">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="Digite sua senha" required>
        </div>

        <button type="submit" class="btn-primary">
          Entrar
        </button>
      </form>

      <div class="auth-footer">
        <span>Não possui acesso?</span>
        <a href="cadastro.html">Criar conta</a>
      </div>

    </div>
  </div>

  <script src="assets/js/auth.js"></script>
</body>
</html>
