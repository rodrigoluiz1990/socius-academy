<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro - Socius Academy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">

      <h1 class="logo">Socius Academy</h1>
      <p class="subtitle">Criar novo acesso</p>

      <form id="registerForm">

        <div class="field">
          <label for="nome">Nome completo</label>
          <input
            type="text"
            id="nome"
            placeholder="Ex: João da Silva"
            required
          >
        </div>

        <div class="field">
          <label for="email">E-mail (usuário)</label>
          <input
            type="email"
            id="email"
            placeholder="email@empresa.com"
            required
          >
        </div>

        <div class="field">
          <label for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            placeholder="Mínimo 6 caracteres"
            required
          >
        </div>

        <div class="field">
          <label for="confirmarSenha">Confirmar senha</label>
          <input
            type="password"
            id="confirmarSenha"
            placeholder="Repita a senha"
            required
          >
        </div>

        <button type="submit" class="btn-primary">
          Criar conta
        </button>

      </form>

      <div class="auth-footer">
        <span>Já possui acesso?</span>
        <a href="index.html">Voltar para login</a>
      </div>

    </div>
  </div>

  <script src="assets/js/auth.js"></script>
</body>
</html>
