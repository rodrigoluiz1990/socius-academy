<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Socius Academy | Aulas</title>

  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/aula.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <h1 onclick="voltarDashboard()">Socius Academy</h1>

    <div class="user">
      <span id="user-name"></span>
      <button onclick="logout()">Sair</button>
    </div>
  </header>

  <!-- CONTEÚDO -->
  <main class="aula-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <h2 id="curso-título"></h2>
      <ul id="lista-aulas"></ul>
    </aside>

    <!-- AULA -->
    <section class="conteudo">
      <h2 id="aula-título"></h2>
      <div id="aula-conteudo" class="conteudo-box">
        <p>Selecione uma aula ao lado.</p>
      </div>
    </section>

  </main>

  <script src="assets/js/auth.js"></script>
  <script src="assets/js/aula.js"></script>

  <script>
    requireAuth();
    loadUserInfo();
  </script>

</body>
</html>
